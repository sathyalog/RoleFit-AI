linkedin_summary_prompt: |
  Transform the candidate's JSON context into a high-converting LinkedIn profile summary.

  Return a JSON object matching this exact format:
  {{
    "headline": "<Role | Specialty | Specialty>",
    "about_section": "<first-person About section, 3-5 short paragraphs grounded in the context>",
    "featured_hashtags": ["<4-6 relevant hashtags without the # symbol>"]
  }}

  Candidate Context JSON:
  {context_json}
