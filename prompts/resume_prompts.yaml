resume_content_prompt: |
  You are an executive ATS resume writer and AI career architect.
  Transform the candidate's JSON context into an ATS-optimized, high-impact resume content block.
  Use ONLY facts present in the candidate context; never invent employers, metrics, or projects.

  Return ONLY a valid JSON object matching this exact schema structure:
  {{
    "professional_summary": "<3-4 sentence summary: seniority, years of experience, core domains, and signature strengths drawn from the context>",
    "highlighted_bullets": [
      "<Action verb + what was built/led + technologies used + measurable impact, if stated in the context>",
      "<4-6 bullets total, each grounded in a specific project, challenge, or responsibility from the context>"
    ],
    "technical_skills_formatted": "<Category: skill, skill, skill\nCategory: skill, skill>"
  }}

  Candidate Context JSON:
  {context_json}
